[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidemd-replication"
version = "0.1.0"
description = "Sanitized replication analysis for the ConfideMD benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
]

[tool.setuptools.packages.find]
include = ["confidemd*"]
